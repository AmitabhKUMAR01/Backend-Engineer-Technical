services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ums
      POSTGRES_PASSWORD: ums
      POSTGRES_DB: ums_payments
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ums -d ums_payments"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    profiles: ["app"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ums:ums@postgres:5432/ums_payments?schema=public
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
